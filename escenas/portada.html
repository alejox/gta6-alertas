<!doctype html><html><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:720px;overflow:hidden;position:relative;font-family:Rubik;
 background:linear-gradient(180deg,#1b0638 0%,#5a1f9e 34%,#ff3fa4 70%,#ffb03a 100%)}
.sun{position:absolute;width:620px;height:620px;border-radius:50%;left:-150px;top:300px;background:linear-gradient(180deg,#fff7c2,#ffb03a 45%,#ff3fa4);

.sub b{color:#ffe08a}
.pill{position:absolute;left:64px;top:548px;transform:skewX(-12deg);padding:12px 30px;border:4px solid #fff;border-radius:10px;background:linear-gradient(90deg,#7b2cff,#ff3fa4 70%,#ffb03a);box-shadow:0 8px 0 #1d0726;font-weight:900;font-style:italic;font-size:26px;color:#fff}
.stk{position:absolute;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35)) drop-shadow(0 0 24px rgba(255,63,164,.6))}
