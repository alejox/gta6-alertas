Settings.Help="<b>How it works</b><br>1. Build your library in <b>Songs</b>.<br>2. Add the <b>AC Songlist</b> source to a scene and choose what to show: <i>Now playing</i>, <i>Request queue</i> or <i>Song list</i>.<br>3. Viewers type <b>!list</b> to see the songs and <b>!sr number</b> or <b>!sr name</b> to request one.<br>4. When you are about to play it, press <b>Play now</b> or <b>Next</b>: the card appears on stream.<br><br><b>Chat commands</b><br>!sr · !list · !queue · !song · !next · !position · !wrongsong<br>Moderators: !sropen · !srclose · !srnext · !srskip"

