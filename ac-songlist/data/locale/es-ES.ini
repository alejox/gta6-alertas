Settings.Help="<b>Cómo se usa</b><br>1. En <b>Canciones</b>, arma tu biblioteca.<br>2. En una escena, agrega la fuente <b>AC Songlist</b> y elige qué mostrar: <i>Sonando ahora</i>, <i>Cola de pedidos</i> o <i>Lista de canciones</i>.<br>3. Tu público escribe <b>!lista</b> para ver las canciones y <b>!sr número</b> o <b>!sr nombre</b> para pedir una.<br>4. Cuando la vayas a tocar, pulsa <b>Tocar ahora</b> o <b>Siguiente</b>: aparece la tarjeta en el stream.<br><br><b>Comandos del chat</b><br>!sr · !lista · !cola · !cancion · !siguiente · !mipedido · !quitar<br>Moderadores: !abrir · !cerrar · !tocada · !saltar"

