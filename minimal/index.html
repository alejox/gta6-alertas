<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,700;1,800;1,900&display=block" rel="stylesheet">
<!--
  PACK MINIMAL · VICE CITY — escenas minimalistas con chat horizontal inferior (1920x1080)
  ?escena=intro | streaming | hablar | pausa | vuelvo | fin     (&canal=TuCanal)
  ?pieza=fondo | titulo | logo | cuenta | canal | texto | marco | nombre | etiqueta | envivo | barra | chat | alerta
  Sin parámetros se abre el menú. En StreamElements cada pieza es un widget independiente
  (lo crea instalar-minimal.html con el JWT). La distribución está en el bloque "layout".
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:'Rubik',sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
:root{--ink:#16052a;--a:#7b2cff;--b:#ff3fa4;--c:#ffb03a}
.t-pausa{--a:#3b3bff;--b:#a04bff;--c:#ff7ad9}
.t-vuelvo{--a:#0b6fb8;--b:#22d3a6;--c:#b9f56a}
.t-fin{--a:#d0246b;--b:#ff8f1f;--c:#ffc93a}
#p{position:absolute;inset:0;--g:linear-gradient(90deg,var(--a),var(--b) 60%,var(--c))}
.in{animation:in .7s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes in{from{opacity:0;transform:translateY(18%)}to{opacity:1;transform:none}}
.pill.in,.lab.in{animation-name:placa}
@keyframes placa{from{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(-8%)}to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
.pill::after,.lab::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);animation:brillo 7s ease-in-out infinite;animation-delay:calc(var(--d,0s) + 1.5s)}
@keyframes brillo{0%{left:-40%}22%,100%{left:120%}}
.lab.in b{animation:in .5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--d,0s) + .35s)}

/* fondo */
.bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(90% 60% at 50% 112%,color-mix(in srgb,var(--b) 38%,transparent),transparent 70%),linear-gradient(180deg,#0b0316,#16052a 70%,#1d0a33)}
.bg .st{position:absolute;inset:0 0 34% 0;background-image:radial-gradient(rgba(255,255,255,.75) 1px,transparent 1.5px),radial-gradient(rgba(255,255,255,.45) 1px,transparent 1.4px);background-size:190px 150px,120px 110px;background-position:30px 40px,80px 10px;-webkit-mask-image:linear-gradient(180deg,#000,transparent);animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.5}}
.bg{--hz:66%;--sol:42vh}
.bg .sun{position:absolute;left:50%;top:var(--hz);width:var(--sol);height:var(--sol);margin:calc(var(--sol)/-2) 0 0 calc(var(--sol)/-2);border-radius:50%;padding:.35vh;background:linear-gradient(180deg,var(--c),var(--b) 55%,var(--a));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sun 7s ease-in-out infinite alternate}
.bg .sw{position:absolute;inset:0;-webkit-mask-image:conic-gradient(from -90deg at 50% var(--hz),#000 var(--draw),transparent 0);animation:trazo 1.6s .3s cubic-bezier(.6,0,.2,1) forwards}
@keyframes sun{from{transform:translateY(1.2vh)}to{transform:translateY(-1.2vh)}}
.bg .cut{position:absolute;left:0;right:0;top:var(--hz);bottom:0;background:linear-gradient(180deg,#16052a,#1d0a33)}
.bg .hz{position:absolute;left:8%;right:8%;top:var(--hz);height:2px;background:linear-gradient(90deg,transparent,var(--a),var(--b),var(--c),transparent);animation:hz 1.2s cubic-bezier(.16,1,.3,1) both}
@keyframes hz{from{transform:scaleX(0)}to{transform:none}}
.bg .ray{position:absolute;left:50%;top:var(--hz);width:2px;height:0;margin-left:-1px;background:linear-gradient(180deg,var(--b),transparent);opacity:.5;animation:ray 4s ease-in-out infinite;animation-delay:1.6s}
@keyframes ray{0%{height:0;opacity:.6}60%,100%{height:30%;opacity:0}}
.bg .ln{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--b) 55%,transparent),transparent);animation:ln 6s linear infinite}
@keyframes ln{0%{transform:translateY(0);opacity:0}15%{opacity:.5}100%{transform:translateY(26vh);opacity:0}}

/* fondo transparente: "velo" deja ver lo que haya detrás con un oscurecido suave; "nada" no pone nada */
.bg.velo,.bg.nada{background:none}
.bg.velo{background:linear-gradient(180deg,rgba(11,3,22,.62),rgba(22,5,42,.28) 42%,rgba(22,5,42,.34) 66%,rgba(11,3,22,.7))}
.bg.velo .st,.bg.nada .st,.bg.velo .cut,.bg.nada .cut{display:none}
.bg.velo .sw,.bg.nada .sw{clip-path:inset(0 0 calc(100% - var(--hz)) 0)}

/* textos */
.tit{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;white-space:nowrap}
.tit.izq{align-items:flex-start;text-align:left}
.tit small{font-weight:700;font-size:8vh;letter-spacing:.5em;padding-left:.5em;color:var(--c);text-transform:uppercase}
.tit.izq small{padding-left:0}
.tit{text-shadow:0 .6vh 4vh rgba(11,3,22,.55)}
.tit h1{font-weight:900;font-style:italic;font-size:44vh;line-height:1.05;text-transform:uppercase;letter-spacing:-.01em}
.tit i{display:block;height:1.6vh;min-height:3px;width:30vh;background:var(--g);border-radius:9px;margin:2.5vh 0 4.5vh;animation:bar 3.2s ease-in-out infinite alternate}
@keyframes bar{from{width:22vh}to{width:60vh}}
.tit span{font-weight:500;font-size:10vh;color:#e6d8f7;letter-spacing:.04em}
.tit.in{animation:none}
.tit.in small{animation:tsm .9s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
.tit.in h1{animation:th1 .8s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--d,0s) + .2s)}
.tit.in i{animation:tbar .7s cubic-bezier(.16,1,.3,1) both,bar 3.2s ease-in-out infinite alternate;animation-delay:calc(var(--d,0s) + .65s),calc(var(--d,0s) + 1.35s)}
.tit.in span{animation:in .7s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--d,0s) + .85s)}
@keyframes tsm{from{opacity:0;letter-spacing:1.2em}to{opacity:1;letter-spacing:.5em}}
@keyframes th1{from{opacity:0;clip-path:inset(100% 0 0 0);transform:translateY(30%) skewX(-8deg)}to{opacity:1;clip-path:inset(-10% -5% -10% -5%);transform:none}}
@keyframes tbar{from{width:0;opacity:0}to{width:22vh;opacity:1}}
.mono,.row{text-shadow:0 .3vh 2vh rgba(11,3,22,.6)}
.mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:78vh;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.row{position:absolute;inset:0;display:flex;align-items:center;gap:22vh;white-space:nowrap;font-weight:700;font-size:48vh;letter-spacing:.14em;text-transform:uppercase}
.row.der{justify-content:flex-end}
.dot{flex:none;width:22vh;height:22vh;border-radius:50%;background:var(--b)}
.dot.live{background:#ff2b4f;position:relative;animation:late 1.6s ease-in-out infinite}
.dot.live::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #ff2b4f;animation:onda 1.6s ease-out infinite}
@keyframes late{50%{transform:scale(.82)}}
@keyframes onda{from{transform:scale(1);opacity:.9}to{transform:scale(2.8);opacity:0}}

/* logo */
.logo{position:absolute;inset:0;animation:lin .9s cubic-bezier(.34,1.4,.64,1) both;animation-delay:var(--d,0s)}
.logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 3vh color-mix(in srgb,var(--b) 55%,transparent));animation:lfl 5s ease-in-out infinite alternate}
@keyframes lin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes lfl{from{transform:translateY(2%)}to{transform:translateY(-2%)}}

/* placas */
.pill{position:absolute;inset:0;display:flex;align-items:center;gap:20vh;padding:0 26vh 0 0;background:rgba(22,5,42,.84);border-radius:10vh;overflow:hidden;white-space:nowrap}
.pill::before{content:"";flex:none;align-self:stretch;width:9vh;min-width:4px;background:linear-gradient(180deg,var(--c),var(--b),var(--a))}
.pill b{font-weight:900;font-style:italic;font-size:46vh}
.lab{position:absolute;inset:0;display:flex;align-items:stretch;gap:16vh;background:rgba(22,5,42,.84);border-radius:10vh;overflow:hidden;white-space:nowrap}
.lab::before{content:"";flex:none;width:8vh;min-width:4px;background:linear-gradient(180deg,var(--c),var(--b),var(--a))}
.lab div{display:flex;flex-direction:column;justify-content:center;gap:4vh;min-width:0}
.lab small{font-weight:700;font-size:21vh;letter-spacing:.2em;color:var(--c);text-transform:uppercase}
.lab b{font-weight:900;font-style:italic;font-size:36vh;overflow:hidden;text-overflow:ellipsis}

/* marco de cámara: el degradado gira despacio por el borde y se dibuja al entrar */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@property --draw{syntax:'<percentage>';initial-value:0%;inherits:false}
.fr{position:absolute;inset:0;border-radius:14px;padding:3px;background:conic-gradient(from var(--ang),var(--a),var(--b),var(--c),var(--b),var(--a));animation:giro 9s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@keyframes giro{to{--ang:360deg}}
.frw{position:absolute;inset:0;-webkit-mask-image:conic-gradient(from -90deg,#000 var(--draw),transparent 0);animation:trazo 1.3s cubic-bezier(.6,0,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes trazo{to{--draw:100%}}
.frc{position:absolute;width:18px;height:18px;border:3px solid #fff;opacity:0;animation:esq .5s ease-out forwards;animation-delay:calc(var(--d,0s) + 1.1s)}
.frc.a{left:-7px;top:-7px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}.frc.b{right:-7px;bottom:-7px;border-left:0;border-top:0;border-radius:0 0 6px 0}
@keyframes esq{from{opacity:0;transform:scale(1.8)}to{opacity:.9;transform:none}}

/* franja y chat */
.bar{position:absolute;inset:0;background:rgba(22,5,42,.86);animation:sube .7s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
.bar::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--b),var(--a));background-size:200% 100%;animation:fluye 6s linear infinite}
.bar::after{content:"";position:absolute;top:0;height:2px;width:14%;left:-14%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:chispa 5s ease-in-out infinite;animation-delay:calc(var(--d,0s) + 1s)}
@keyframes sube{from{transform:translateY(100%)}to{transform:none}}
@keyframes fluye{to{background-position:-200% 0}}
@keyframes chispa{0%{left:-14%}45%,100%{left:100%}}
.chat{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;gap:36vh;overflow:hidden;white-space:nowrap;font-size:40vh;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%)}
.chat.izq{justify-content:flex-start;-webkit-mask-image:linear-gradient(270deg,transparent,#000 6%)}
.msg{flex:none;display:flex;align-items:center;gap:14vh;animation:min .45s cubic-bezier(.16,1,.3,1) both}
@keyframes min{from{opacity:0;transform:translateX(60vh)}to{opacity:1;transform:none}}
.msg::before{content:"";width:5vh;min-width:3px;height:44vh;background:linear-gradient(180deg,var(--c),var(--b));transform:skewX(-14deg)}
.msg b{font-weight:900;font-style:italic;color:var(--c)}
.msg span{font-weight:500;color:#f1e8fb}
.msg img{height:52vh;vertical-align:middle;margin:0 2vh}

/* alertas en dos niveles: discreta (píldora pequeña) y destacada (más grande, con el sticker como icono) */
.alw{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start}
.al{position:relative;display:flex;align-items:center;gap:8vh;height:52vh;max-width:100%;padding-right:14vh;background:rgba(22,5,42,.92);border-radius:7vh;white-space:nowrap;opacity:0;--ev:var(--b)}
.al::before{content:"";flex:none;align-self:stretch;width:4.5vh;min-width:5px;border-radius:7vh 0 0 7vh;background:linear-gradient(180deg,var(--c),var(--b),var(--a))}
.al::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;border-radius:0 0 7vh 7vh;background:var(--g);transform-origin:0 50%;transform:scaleX(0)}
.al.on{animation:alin .5s cubic-bezier(.16,1,.3,1) forwards}
.al.on::after{animation:alp var(--hold,5s) linear forwards}
.al.off{animation:alout .4s ease-in forwards}
@keyframes alin{from{opacity:0;transform:translateY(-60%)}to{opacity:1;transform:none}}
@keyframes alout{from{opacity:1}to{opacity:0;transform:translateY(-40%)}}
@keyframes alp{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes alt{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.al .alc{display:flex;align-items:baseline;gap:8vh;min-width:0}
.al.on small{animation:alt .4s .15s both}.al.on b{animation:alt .45s .28s both}.al.on em{animation:alt .45s .42s both}
.al small{font-weight:700;font-size:12vh;letter-spacing:.22em;color:var(--c);text-transform:uppercase}
.al b{font-weight:900;font-style:italic;font-size:22vh}
.al em{font-style:normal;font-weight:500;font-size:16vh;color:#e6d8f7;overflow:hidden;text-overflow:ellipsis}
.al .ico{display:none}
/* destacada */
.al.big{height:92vh;gap:5vh;padding-right:22vh;border-radius:9vh;margin-top:4vh}
.al.big::before{background:var(--ev);width:5.5vh;border-radius:9vh 0 0 9vh}
.al.big::after{background:linear-gradient(90deg,var(--ev),var(--c));height:4px;border-radius:0 0 9vh 9vh}
.al.big .ico{display:block;flex:none;position:relative;width:104vh;height:92vh;margin:0 0 0 1vh}
.al.big .ico img{position:absolute;left:0;top:5vh;width:100%;height:80vh;object-fit:contain;filter:drop-shadow(0 1.5vh 0 rgba(0,0,0,.35))}
.al.big .ico::before{content:"";position:absolute;left:50%;top:50%;width:44vh;height:44vh;margin:-22vh;border-radius:50%;border:2px solid var(--ev);opacity:0}
.al.big.on .ico img{animation:stk .7s .12s cubic-bezier(.34,1.56,.64,1) both,stf 2.4s 1s ease-in-out infinite alternate}
.al.big.on .ico::before{animation:ring 1.1s .25s ease-out both}
@keyframes stk{from{opacity:0;transform:scale(0) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes stf{from{transform:rotate(-3deg)}to{transform:rotate(3deg) translateY(-3%)}}
@keyframes ring{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2.1)}}
.al.big .alc{flex-direction:column;align-items:flex-start;justify-content:center;gap:2.5vh}
.al.big small{font-size:13vh;color:var(--ev);filter:brightness(1.35)}
.al.big b{font-size:33vh;line-height:1}
.al.big em{font-size:17vh}

/* vista local */
body.menu{background:#0d0616;overflow:auto}
#menu{max-width:1200px;margin:0 auto;padding:40px 24px 80px}
#menu h1{font-weight:900;font-style:italic;font-size:38px;margin-bottom:6px}
#menu p{color:#cdb8e6;margin-bottom:26px;line-height:1.5}
#menu code{background:#241236;padding:2px 7px;border-radius:5px;color:#ffd0ee}
#menu .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
#menu a{display:block;text-decoration:none;color:#fff;background:#190b28;border:2px solid #3a1d57;border-radius:12px;overflow:hidden}
#menu .th{height:0;padding-bottom:56.25%;position:relative;overflow:hidden;background:repeating-conic-gradient(#2a1a3a 0 25%,#1c1028 0 50%) 0 0/40px 40px}
#menu iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
#menu .cp{padding:12px 16px;font-weight:700}
#comp{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#comp iframe{position:absolute;border:0;background:transparent}
</style></head>

if(k==='fondo'){

  const m=h?`-webkit-mask-image:linear-gradient(#000,#000),linear-gradient(#000,#000);-webkit-mask-size:100% 100%,${(h[2]-6)/LW*100}% ${(h[3]-6)/LH*100}%;-webkit-mask-position:0 0,${(h[0]+3)/(LW-h[2]+6)*100}% ${(h[1]+3)/(LH-h[3]+6)*100}%;-webkit-mask-repeat:no-repeat;-webkit-mask-composite:xor;mask-composite:exclude`:'';
  root.innerHTML=`<div class="bg ${({velo:'velo',nada:'nada'})[Q.get('fondo')]||''}" style="${m};${Q.get('horizonte')?`--hz:${parseFloat(Q.get('horizonte'))}%;`:''}${Q.get('sol')?`--sol:${parseFloat(Q.get('sol'))}vh;`:''}"><div class="st"></div><div class="sw"><div class="sun"></div></div><div class="cut"></div><div class="hz"></div><div class="ray"></div>${[0,1,2,3].map(i=>`<div class="ln" style="top:calc(var(--hz) + 1%);animation-delay:${-i*1.5}s"></div>`).join('')}</div>`;
}
else if(k==='titulo') root.innerHTML=`<div class="tit in ${Q.get('lado')==='izq'?'izq':''}"><small>${P('over','El directo')}</small><h1>${P('titulo','Empezamos')}</h1><i></i><span>${P('sub','No te vayas')}</span></div>`;

}
else if(k==='canal')  root.innerHTML=`<div class="row in"><span class="dot"></span>${canal}</div>`;

/* ---------- chat horizontal ---------- */
function chat(){
  const max=Math.max(1,parseInt(Q.get('max'))||8), izq=Q.get('lado')==='izq', color=Q.get('color')==='usuario';
  root.innerHTML=`<div class="chat ${izq?'izq':''}" id="ch"></div>`;
  const box=document.getElementById('ch');
  function texto(d){
    const t=String(d.text||''); let out='',i=0;
    for(const e of (d.emotes||[]).slice().sort((a,b)=>a.start-b.start)){
      if(!(e.start>=i)) continue; const u=e.urls&&(e.urls['2']||e.urls['1']||e.urls['4']);
      out+=esc(t.slice(i,e.start))+(u?`<img src="${esc(u)}" alt="">`:esc(t.slice(e.start,e.end+1))); i=e.end+1;
    }
    return out+esc(t.slice(i));
  }
  function add(d){
    const m=document.createElement('div'); m.className='msg'; if(d.msgId) m.dataset.id=d.msgId; if(d.userId) m.dataset.user=d.userId;
    const c=color&&/^#[0-9a-f]{3,8}$/i.test(d.displayColor||'')?` style="color:${d.displayColor}"`:'';
    m.innerHTML=`<b${c}>${esc(d.displayName||d.nick||'Anónimo')}</b><span>${texto(d)}</span>`;
    if(izq) box.insertBefore(m,box.firstChild); else box.appendChild(m);
    while(box.children.length>max) box.removeChild(izq?box.lastChild:box.firstChild);
  }
  window.addEventListener('onEventReceived',o=>{
    const d=o.detail||{}, e=d.event||{};
    if(d.listener==='message'&&e.data) add(e.data);
    else if(d.listener==='delete-message') box.querySelectorAll('.msg').forEach(m=>{if(m.dataset.id===e.msgId)m.remove();});
    else if(d.listener==='delete-messages') box.querySelectorAll('.msg').forEach(m=>{if(m.dataset.user===e.userId)m.remove();});
  });
  if(editor){   // mensajes de ejemplo: solo en el editor o en la vista local
    const S=[['Leonida_Fan','¡Qué buen directo!'],['ViceCityKid','jajaja ese salto'],['Lucia_VC','saludos desde Miami'],['Jason_D','¿cuándo el siguiente?'],['NeonPalm','GG']];
    S.forEach(x=>add({displayName:x[0],text:x[1]})); if(!CFG){let n=0;setInterval(()=>{const x=S[n++%S.length];add({displayName:x[0],text:x[1]});},2600);}
  }
}

/* ---------- alertas: discretas y destacadas ---------- */
function alerta(){
  const hold=Math.max(2,parseFloat(Q.get('seg'))||5), snd=Q.get('sonido')!=='no', vol=Math.min(1,Math.max(0,(parseFloat(Q.get('volumen'))||50)/100));
  const minTip=+Q.get('mintip')||0, minBits=+Q.get('minbits')||0, minKicks=+Q.get('minkicks')||0, cur=Q.get('moneda')||'$';
  const destBits=Q.get('destbits')==null?100:+Q.get('destbits'), destKicks=Q.get('destkicks')==null?100:+Q.get('destkicks');
  const conStk=Q.get('stickers')!=='no', STK=(CFG&&CFG.__stk)||'../stickers/';
  // tipo: [título, sonido, sticker, color, destacada]
  const T={follow:['Nuevo seguidor','seguidor','flamenco','#ff3fa4',false],sub:['Nuevo suscriptor','suscriptor','caiman','#2f7bff',true],resub:['Resub','resub','sol','#ffae1f',true],
    gift:['Subs regalados','regalos','avioneta','#ff2f8e',true],tip:['Donación','donacion','manati','#ffa51c',true],raid:['Raid','raid','lowrider','#6a3dff',true],
    kicks:['KICKs','kicks','palmera','#3fd85a',d=>(+d.amount||0)>=destKicks],cheer:['Bits','bits','vi','#ff4fa8',d=>(+d.amount||0)>=destBits],host:['Host','host','rstar','#d03bff',true]};
  root.innerHTML=`<div class="alw"><div class="al" id="al"><span class="ico"><img id="ali" alt=""></span><div class="alc"><small id="alt"></small><b id="aln"></b><em id="alx"></em></div></div></div>`;
  const el=document.getElementById('al'), q=[]; let busy=false;
  if(conStk) Object.values(T).forEach(t=>{const i=new Image();i.src=STK+t[2]+'.png';});   // precarga
  const extra=d=>({resub:`${d.amount} meses`,gift:`regaló ${d.amount} ${+d.amount===1?'sub':'subs'}`,tip:`${cur}${Math.round((+d.amount||0)*100)/100}`,raid:`llega con ${d.amount} espectadores`,kicks:`${d.amount} KICKs`,cheer:`${d.amount} bits`,host:`con ${d.amount} espectadores`}[d.type]||'');
  const fin=()=>{try{SE_API.resumeQueue();}catch(e){}};
  function next(){
    if(busy||!q.length) return; busy=true; const d=q.shift(), t=T[d.type];
    const big=typeof t[4]==='function'?t[4](d):t[4], h=big?hold+3:hold;
    document.getElementById('alt').textContent=t[0]; document.getElementById('aln').textContent=d.name; document.getElementById('alx').textContent=extra(d);
    document.getElementById('ali').src=big&&conStk?STK+t[2]+'.png':''; el.querySelector('.ico').style.display=big&&conStk?'':'none';
    el.style.setProperty('--ev',t[3]); el.style.setProperty('--hold',h+'s');
    if(snd&&CFG&&CFG.__sonidos){try{const a=new Audio(CFG.__sonidos+t[1]+'.mp3');a.volume=vol;a.play().catch(()=>{});}catch(e){}}
    const cls='al'+(big?' big':''); el.className=cls; void el.offsetWidth; el.className=cls+' on';
    setTimeout(()=>{el.className=cls+' off';setTimeout(()=>{busy=false;fin();next();},450);},h*1000);
  }
  const play=d=>{if(!T[d.type]){fin();return;} q.push(d);next();};
  window.addEventListener('onEventReceived',o=>{
    if(!o.detail) return; const L=o.detail.listener, e=o.detail.event||{}, name=e.name||e.displayName||'Anónimo';
    switch(L){
      case 'follower-latest': play({type:'follow',name}); break;
      case 'subscriber-latest':
        if(e.isCommunityGift){fin();return;}
        if(e.bulkGifted) play({type:'gift',name:e.sender||name,amount:e.amount||1});
        else if(e.gifted) play({type:'gift',name:e.sender||name,amount:1});
        else if((+e.amount||1)>1) play({type:'resub',name,amount:e.amount});
        else play({type:'sub',name}); break;
      case 'tip-latest':   (+e.amount||0)>=minTip?play({type:'tip',name,amount:e.amount}):fin(); break;
      case 'raid-latest':  play({type:'raid',name,amount:e.amount}); break;
      case 'kicks-latest': (+e.amount||0)>=minKicks?play({type:'kicks',name,amount:e.amount}):fin(); break;
      case 'cheer-latest': (+e.amount||0)>=minBits?play({type:'cheer',name,amount:e.amount}):fin(); break;
      case 'host-latest':  play({type:'host',name,amount:e.amount}); break;
    }
  });
  if(editor){   // ejemplos (uno destacado y uno discreto): solo en el editor o en la vista local
    const D=Q.get('ejemplo')?[{type:Q.get('ejemplo'),name:'Leonida_Fan',amount:Q.get('cantidad')||5}]:[{type:'sub',name:'Leonida_Fan'},{type:'follow',name:'ViceCityKid'}]; let n=0;
    const demo=()=>play(D[n++%D.length]); setTimeout(demo,2200); setInterval(demo,(hold+6)*1000);
  }
}
}

  const Q=new URLSearchParams(location.search), L=JSON.parse(document.getElementById('layout').textContent);
  if(Q.get('pieza')){minMain();return;}
  const piezas=window.minPiezas(L);
  const e=Q.get('escena'), canal=Q.get('canal')||'@TUCANAL';
  const url=(tema,p)=>'?'+new URLSearchParams({pieza:p[1],tema,canal,demo:'1',...p[3]}).toString();
  if(e&&piezas[e]){
    const [W,H]=L.escenas[e].lienzo||[1920,1080];
    const c=document.createElement('div');c.id='comp';c.style.width=W+'px';c.style.height=H+'px';document.body.appendChild(c);
    piezas[e].filter(p=>p[3].oculto!=='si').forEach(p=>{const f=document.createElement('iframe');f.src=url(L.escenas[e].tema,p);f.style.cssText=`left:${p[2][0]}px;top:${p[2][1]}px;width:${p[2][2]}px;height:${p[2][3]}px`;c.appendChild(f);});
    if(Q.get('guia')&&L.zonaSegura&&L.escenas[e].lienzo){const z=L.zonaSegura,g=document.createElement('div');g.style.cssText=`position:absolute;inset:0;pointer-events:none;z-index:99;background:rgba(255,40,60,.32);-webkit-mask:linear-gradient(#000 0 0),linear-gradient(#000 0 0) ${z.x}px ${z.y}px/${z.w}px ${z.h}px no-repeat;-webkit-mask-composite:xor;mask-composite:exclude;outline:3px dashed #fff;outline-offset:-3px`;
      g.innerHTML=`<div style="position:absolute;left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px;border:3px dashed #fff"></div>`;c.appendChild(g);}
    const fit=()=>{const k=Math.min(innerWidth/W,innerHeight/H);c.style.transform=`translateX(${(innerWidth-W*k)/2}px) scale(${k})`;};addEventListener('resize',fit);fit();return;
  }
  document.body.classList.add('menu');const m=document.createElement('div');m.id='menu';document.body.appendChild(m);
  m.innerHTML=`<h1>Pack Minimal · Vice City</h1><p>Vista previa de las escenas. En OBS: fuente de navegador 1920×1080 con <code>?escena=streaming&canal=TuCanal</code>. Para mover cada pieza por separado, instálalo con el JWT (<code>instalar-minimal.html</code>).</p><div class="gr">`+
    Object.keys(piezas).map(k=>`<a href="?escena=${k}"><div class="th"><iframe src="?escena=${k}" loading="lazy" data-v="${L.escenas[k].lienzo?1:''}"></iframe></div><div class="cp">${L.escenas[k].nombre} <code>?escena=${k}</code></div></a>`).join('')+'</div>';
  const fit=()=>m.querySelectorAll('.th').forEach(t=>{const f=t.firstChild,v=f.dataset.v;if(v){f.style.width='1080px';f.style.height='1920px';const k=t.clientHeight/1920;f.style.transform=`translateX(${(t.clientWidth-1080*k)/2}px) scale(${k})`;}else f.style.transform=`scale(${t.clientWidth/1920})`;});addEventListener('resize',fit);fit();
}
/* Lista de piezas de cada escena (la usa también el generador del instalador) */
window.minPiezas=function(L){
  const out={};
  for(const k in L.escenas){const s=L.escenas[k];
