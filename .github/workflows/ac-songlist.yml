# Compila el plugin AC Songlist para OBS Studio (Windows, macOS y Linux) y ejecuta sus pruebas.
# El .dll listo para instalar queda como artefacto "AC-Songlist-Windows" en cada ejecucion.
# Al crear una etiqueta ac-songlist-vX.Y.Z se publica ademas como Release.
name: AC Songlist

on:
  push:
    branches: ['**']
    tags: ['ac-songlist-v*']
    paths:
      - 'ac-songlist/**'
      - '.github/workflows/ac-songlist.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Se compila contra la version mas antigua soportada: un plugin hecho para OBS 30.2
  # carga tambien en las versiones posteriores, pero no al reves.
  OBS_VERSION: '30.2.3'
  QT_VERSION: '6.6.3'

jobs:
  linux:
    name: Linux (compilar y probar)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libobs-dev qt6-base-dev libgl1-mesa-dev

      - name: Compilar
        run: |
          cmake -S ac-songlist -B build -G Ninja -DACSL_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build

      - name: Pruebas
        run: QT_QPA_PLATFORM=offscreen ./build/acsl-tests

      - name: Empaquetar
        run: |
          mkdir -p pkg/ac-songlist/bin/64bit pkg/ac-songlist/data
          cp build/ac-songlist.so pkg/ac-songlist/bin/64bit/
          cp -r ac-songlist/data/locale pkg/ac-songlist/data/
          cp ac-songlist/installer/LEEME.txt pkg/
          tar -C pkg -czf AC-Songlist-Linux.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: AC-Songlist-Linux
          path: AC-Songlist-Linux.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (.dll)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      # OBS no publica un SDK para Windows. Se arma uno minimo: las cabeceras salen del
      # codigo fuente de esa version y las librerias de importacion se generan a partir
      # de los .dll del instalador oficial.
      - name: SDK de OBS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:OBS_VERSION
          New-Item -ItemType Directory -Force sdk/include, sdk/lib, obs-bin, obs-dl | Out-Null

          $assets = gh release view $ver --repo obsproject/obs-studio --json assets --jq '.assets[].name'
          $zip = $assets | Where-Object { $_ -match '\.zip$' -and $_ -notmatch 'PDB|Sources|arm64|macOS' } | Select-Object -First 1
          if (-not $zip) { throw "No encuentro el zip de Windows de OBS $ver. Archivos: $assets" }
          Write-Host "Binarios de OBS: $zip"
          gh release download $ver --repo obsproject/obs-studio --pattern $zip --dir obs-dl
          Expand-Archive "obs-dl/$zip" -DestinationPath obs-bin

          git clone --quiet --depth 1 --branch $ver https://github.com/obsproject/obs-studio.git obs-src
          robocopy obs-src/libobs sdk/include *.h *.hpp /S /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy fallo ($LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
          $frontend = Get-ChildItem obs-src -Recurse -Filter obs-frontend-api.h | Select-Object -First 1
          if (-not $frontend) { throw 'No encuentro obs-frontend-api.h' }
          Copy-Item $frontend.FullName sdk/include/
          Copy-Item obs-src/deps/w32-pthreads/*.h sdk/include/
          # obsconfig.h lo genera el CMake de OBS; para compilar un plugin basta con esto
          Set-Content sdk/include/obsconfig.h -Encoding ascii -Value @(
            '#pragma once',
            '#define OBS_DATA_PATH "../../data"',
            '#define OBS_PLUGIN_PATH "../../obs-plugins/64bit"',
            '#define OBS_PLUGIN_DESTINATION "obs-plugins/64bit"')

          function New-ImportLib([string]$name) {
            $dll = Get-ChildItem obs-bin -Recurse -Filter "$name.dll" | Select-Object -First 1
            if (-not $dll) { throw "No encuentro $name.dll en el zip de OBS" }
            $exports = & dumpbin /nologo /exports $dll.FullName | ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)') { $Matches[1] }
            }
            if (@($exports).Count -lt 5) { throw "No pude leer los simbolos de $name.dll" }
            Set-Content "sdk/lib/$name.def" -Encoding ascii -Value (@("LIBRARY `"$name`"", 'EXPORTS') + ($exports | ForEach-Object { "  $_" }))
            & lib /nologo "/def:sdk/lib/$name.def" /machine:x64 "/out:sdk/lib/$name.lib"
            if ($LASTEXITCODE -ne 0) { throw "lib.exe fallo con $name" }
            Write-Host "$name.lib: $(@($exports).Count) simbolos"
          }
          New-ImportLib 'obs'
          New-ImportLib 'obs-frontend-api'

      - name: Compilar
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = (Resolve-Path sdk).Path.Replace('\', '/')
          $qt = "$env:QT_ROOT_DIR".Replace('\', '/')
          cmake -S ac-songlist -B build -G "Visual Studio 17 2022" -A x64 "-DOBS_SDK_DIR=$sdk" "-DCMAKE_PREFIX_PATH=$qt" -DACSL_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'cmake (configurar)' }
          cmake --build build --config RelWithDebInfo --parallel
          if ($LASTEXITCODE -ne 0) { throw 'cmake (compilar)' }

      - name: Pruebas
        run: |
          ./build/RelWithDebInfo/acsl-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas' }

      - name: Empaquetar
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install build --config RelWithDebInfo --prefix pkg
          if ($LASTEXITCODE -ne 0) { throw 'cmake (instalar)' }
          Copy-Item ac-songlist/installer/instalar.bat, ac-songlist/installer/LEEME.txt pkg/
          $dll = 'pkg/ac-songlist/bin/64bit/ac-songlist.dll'
          if (-not (Test-Path $dll)) { throw "Falta $dll" }
          Write-Host '--- contenido del paquete'
          Get-ChildItem pkg -Recurse -File | ForEach-Object { '{0,10}  {1}' -f $_.Length, $_.FullName.Substring((Resolve-Path pkg).Path.Length + 1) }
          Write-Host '--- de que depende el .dll'
          $deps = dumpbin /nologo /dependents $dll | ForEach-Object { if ($_ -match '^\s+(\S+\.dll)\s*$') { $Matches[1] } }
          $system = '^(KERNEL32|USER32|MSVCP140|VCRUNTIME140(_1)?|api-ms-win-.*)\.dll$'
          foreach ($dep in $deps) {
            if ($dep -match $system) { Write-Host "  $dep (Windows / Visual C++)"; continue }
            $found = Get-ChildItem obs-bin -Recurse -Filter $dep | Select-Object -First 1
            if (-not $found) { throw "$dep no viene con OBS: el plugin no cargaria" }
            Write-Host "  $dep (incluido en OBS)"
          }
          $tls = Get-ChildItem obs-bin -Recurse -Filter 'qschannelbackend.dll' | Select-Object -First 1
          Write-Host "--- conexion segura de Qt dentro de OBS (para que el bot conteste): $(if ($tls) { 'si' } else { 'NO: el plugin leera el chat pero no respondera' })"
          Compress-Archive -Path pkg/* -DestinationPath AC-Songlist-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AC-Songlist-Windows
          path: pkg/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/ac-songlist-v')
        with:
          name: release-windows
          path: AC-Songlist-Windows.zip

  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      # Igual que en Windows: cabeceras del codigo fuente de esa version y, para enlazar,
      # los binarios de las dos apps oficiales (Apple Silicon e Intel) unidos en uno universal.
      - name: SDK de OBS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="$OBS_VERSION"
          mkdir -p sdk/include sdk/lib obs-dl
          assets=$(gh release view "$ver" --repo obsproject/obs-studio --json assets --jq '.assets[].name')
          for arch in Apple Intel; do
            dmg=$(echo "$assets" | grep -E "macOS.*${arch}.*\.dmg$" | head -1 || true)
            if [ -z "$dmg" ]; then echo "No encuentro el dmg de $arch. Archivos: $assets"; exit 1; fi
            echo "Binarios de OBS ($arch): $dmg"
            gh release download "$ver" --repo obsproject/obs-studio --pattern "$dmg" --dir obs-dl
            mnt="$PWD/mnt-$arch"; mkdir -p "$mnt" "bin-$arch"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "obs-dl/$dmg" >/dev/null
            app=$(find "$mnt" -maxdepth 2 -name 'OBS.app' | head -1)
            fw="$app/Contents/Frameworks"
            cp "$(find "$fw/libobs.framework" -type f -name libobs | head -1)" "bin-$arch/libobs.dylib"
            cp "$(find "$fw" -maxdepth 1 -name '*frontend-api*.dylib' | head -1)" "bin-$arch/obs-frontend-api.dylib"
            if [ "$arch" = Apple ]; then
              ls "$fw" > obs-frameworks.txt
              echo "Qt dentro de OBS: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$fw/QtCore.framework/Resources/Info.plist" 2>/dev/null || echo desconocido)"
              tls=$(find "$app/Contents" \( -name 'libqsecuretransportbackend*' -o -name 'libqopensslbackend*' \) -print -quit)
              if [ -n "$tls" ]; then echo "Conexion segura de Qt dentro de OBS: si"; else echo "Conexion segura de Qt dentro de OBS: NO (el plugin leera el chat pero no respondera)"; fi
            fi
            hdiutil detach "$mnt" >/dev/null
          done
          for lib in libobs.dylib obs-frontend-api.dylib; do
            archs=$(lipo -archs "bin-Apple/$lib")
            if [[ "$archs" == *x86_64* ]]; then
              cp "bin-Apple/$lib" "sdk/lib/$lib"
            else
              lipo -create "bin-Apple/$lib" "bin-Intel/$lib" -output "sdk/lib/$lib"
            fi
            echo "$lib: $(lipo -archs "sdk/lib/$lib") -> $(otool -D "sdk/lib/$lib" | tail -1)"
          done

          git clone --quiet --depth 1 --branch "$ver" https://github.com/obsproject/obs-studio.git obs-src
          rsync -a --include='*/' --include='*.h' --include='*.hpp' --exclude='*' obs-src/libobs/ sdk/include/
          cp "$(find obs-src -name obs-frontend-api.h | head -1)" sdk/include/
          printf '%s\n' '#pragma once' '#define OBS_DATA_PATH "../Resources"' '#define OBS_PLUGIN_PATH "../PlugIns"' '#define OBS_PLUGIN_DESTINATION "../PlugIns"' > sdk/include/obsconfig.h

      - name: Compilar
        run: |
          set -euo pipefail
          cmake -S ac-songlist -B build -DOBS_SDK_DIR="$PWD/sdk" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DACSL_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --parallel

      - name: Pruebas
        run: ./build/acsl-tests

      - name: Empaquetar
        run: |
          set -euo pipefail
          bundle=pkg/ac-songlist.plugin/Contents
          mkdir -p "$bundle/MacOS" "$bundle/Resources"
          cp build/ac-songlist.so "$bundle/MacOS/ac-songlist"
          strip -x "$bundle/MacOS/ac-songlist"
          cp -R ac-songlist/data/locale "$bundle/Resources/"
          cp ac-songlist/installer/macos/Info.plist "$bundle/"
          codesign --force --sign - pkg/ac-songlist.plugin
          cp ac-songlist/installer/macos/instalar.command ac-songlist/installer/macos/LEEME-MAC.txt ac-songlist/installer/LEEME.txt pkg/
          chmod +x pkg/instalar.command

          bin="$bundle/MacOS/ac-songlist"
          archs=$(lipo -archs "$bin")
          echo "--- arquitecturas: $archs"
          if [[ "$archs" != *arm64* || "$archs" != *x86_64* ]]; then echo "El plugin no es universal"; exit 1; fi
          echo "--- de que depende el plugin"
          # Todo lo que no sea del sistema tiene que venir dentro de OBS.app
          otool -L -arch arm64 "$bin" | tail -n +2 | awk '{print $1}' | while read -r dep; do
            case "$dep" in
              /usr/lib/*|/System/*) echo "  $dep (macOS)";;
              @rpath/*)
                first=$(echo "${dep#@rpath/}" | cut -d/ -f1)
                if grep -qx "$first" obs-frameworks.txt; then echo "  $dep (incluido en OBS)"; else echo "  $dep NO viene con OBS: el plugin no cargaria"; exit 1; fi;;
              *) echo "  $dep: ruta inesperada"; exit 1;;
            esac
          done
          codesign --verify --verbose=2 pkg/ac-songlist.plugin
          # tar conserva los permisos de ejecucion; el zip de los artefactos no
          tar -C pkg -czf AC-Songlist-macOS.tar.gz .
          echo "--- contenido del paquete"; tar -tzvf AC-Songlist-macOS.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: AC-Songlist-macOS
          path: AC-Songlist-macOS.tar.gz
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/ac-songlist-v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "AC Songlist ${GITHUB_REF_NAME#ac-songlist-v}" \
            --notes "Plugin de OBS Studio para pedidos de canciones. Windows: descomprime AC-Songlist-Windows.zip y ejecuta instalar.bat. macOS: descomprime AC-Songlist-macOS.tar.gz y sigue LEEME-MAC.txt." \
            dist/release-windows/AC-Songlist-Windows.zip dist/AC-Songlist-macOS/AC-Songlist-macOS.tar.gz dist/AC-Songlist-Linux/AC-Songlist-Linux.tar.gz
